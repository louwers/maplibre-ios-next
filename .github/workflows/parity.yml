name: Parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      render_list:
        description: Render tests to run ("all" for every upstream render test)
        default: ""

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: API surface
        run: Parity/run.sh api
      - name: Behaviour and render tests
        env:
          PARITY_RENDER_LIST: ${{ inputs.render_list }}
        run: Parity/run.sh behaviour --impl both && Parity/run.sh render --impl both
      - name: Summary
        if: always()
        run: cat Parity/out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: |
            Parity/out/report.md
            Parity/out/report.html
            Parity/out/report.json
            Parity/out/api-diff.json
            Parity/out/*/status.json
            Parity/out/*/coverage.json
            Parity/out/*/traces
            Parity/out/*/build-errors.txt
            Parity/out/*/build.log
            Parity/out/render-diff
      # The harness reports a part that did not run instead of failing, so
      # check that both implementations built and ran every part. Test
      # failures are expected: some upstream tests fail against classic too.
      - name: Both implementations ran
        run: |
          python3 - <<'PY'
          import json, sys
          ok = True
          for impl in ("classic", "next"):
              status = json.load(open(f"Parity/out/{impl}/status.json"))
              for part, expected in (("build", {"ok"}),
                                     ("behaviour", {"ok", "finished-with-failures"}),
                                     ("render", {"ok"})):
                  state = status.get(part, {}).get("state")
                  if state not in expected:
                      print(f"::error::{impl} {part}: {state}: {status[part].get('message', '')}")
                      ok = False
          sys.exit(0 if ok else 1)
          PY
